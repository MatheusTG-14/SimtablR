name: Extended statistical tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  extended-statistics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIMTABLR_EXTENDED_TESTS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools
          dependencies: '"all"'

      - name: Run regular and extended statistical tests
        run: Rscript -e 'devtools::test()'
